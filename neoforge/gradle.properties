org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment — читаемые имена параметров в ванильном коде. Не влияет на итоговый jar.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Версии брать тут: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1,21.2)
loader_version_range=[1,)

mod_id=teamping
mod_name=TeamPing
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.teamping

# Имя автора и описание живут прямо в src/main/templates/META-INF/neoforge.mods.toml:
# gradle.properties читается как ISO-8859-1, кириллица оттуда превратится в мохибейк.
